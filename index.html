<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="second.css">
</head>
<body>
    <header>
        <h1>RPS ARENA ⚔️</h1>
        <button id="music-btn" type="button">🔇 Music Off</button>
        <button id="dark-mode" type="button">🌙 Dark Mode</button>
    </header>

    <main>
        <section class="choices" aria-label="Choose your move">
            <button class="choice" id="rock" type="button">
                <img src="rock.png" alt="Rock">
            </button>
            <button class="choice" id="paper" type="button">
                <img src="paper.png" alt="Paper">
            </button>
            <button class="choice" id="scissor" type="button">
                <img src="scissor.jpg" alt="Scissors">
            </button>
        </section>

        <section class="score-board">
            <div class="score">
                <p id="user-score">0</p>
                <p>👤 You</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>🤖 Computer</p>
            </div>
        </section>

        <div class="message-container">
            <p id="msg">Play your move</p>
        </div>

        <button class="restart" id="restart-game" type="button">
            Restart
        </button>
    </main>

    <footer class="bottom-nav">
        <p>Made with ❤️ by ~Anand Ramavath</p>
        <p>“Every move is a chance to win. 🎯”</p>
    </footer>

    <audio id="bg-music" loop>
        <source src="anand.mp3" type="audio/mpeg">
    </audio>

    <script src="second.js"></script>
</body>
</html>
