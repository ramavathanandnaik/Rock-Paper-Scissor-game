<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROck paper Scissors</title>
    <link rel="stylesheet" href="second.css">
</head>
<body>
    <h1>RPS ARENA ⚔️ </h1>
    
    <div class="choices">
        <div class="choice" id="rock" >
            <img src="rock.png">

        </div>
        <div class="choice" id="paper">
            <img src="paper.png">
        </div>
        <div class="choice" id="scissor">
            <img src="scissor.jpg">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>👤 You</p>
        </div>
        <div class="score">
            <p id="comp-score">0</p>
            <p>🤖 Computer</p>
        </div>
    </div>
    <div class="message-container">
       <p id="msg">play your move </p>
    </div>
    <div class="restart">
        <button><p id="restart-game"> Restart</p></button>
    </div>
    <nav class="bottom-nav">
    <div class="name">Made with ❤️ by ~Anand Ramavath</div>
    <br>
    <br>
    <p id="ana">--“Every move is a chance to win. 🎯”--</p>
    
</nav>
<button id="dark-mode">🌙 Dark Mode</button>
<button id="music-btn">🔇 Music Off</button>

<audio id="bg-music" loop>
    <source src="anand.mp3">
</audio>
<script src="second.js"></script>
</body>
</html>
